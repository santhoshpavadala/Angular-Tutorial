<h2>NGRX - Counter: {{ (count$ | async) ?? 0 }}</h2>

<button (click)="store.dispatch(increment())">
    Increment
</button>

<button (click)="store.dispatch(decrement())">
    Decrement
</button>

<button (click)="store.dispatch(reset())">
    Reset
</button>
